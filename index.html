<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d141b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>鲸鲸的小屋</title>
<style>
  :root{
    --ink:#e8eef4; --dim:#8fa2b3; --mint:#8fd8c4;
    --panel:rgba(20,26,34,.72); --line:rgba(232,238,244,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a0f14;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
  #app{position:fixed;inset:0}
  #app canvas{touch-action:none}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .top{position:absolute;left:20px;right:20px;top:16px;display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--mint);
    box-shadow:0 0 0 4px rgba(143,216,196,.15)}
  .brand h1{margin:0;font-size:14px;font-weight:600;letter-spacing:1.4px;color:var(--ink)}
  .status{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:6px 11px;border-radius:8px;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);font-size:11.5px;line-height:1;
    backdrop-filter:blur(6px)}
  .chip b{color:var(--ink);font-weight:500}
  .dock{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;
    display:flex;gap:8px;pointer-events:auto}
  .btn{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;
    background:var(--panel);border:1px solid var(--line);color:var(--dim);
    font-size:12px;cursor:pointer;user-select:none;backdrop-filter:blur(8px);
    transition:color .15s,border-color .15s,background .15s}
  .btn:hover{color:var(--ink);border-color:rgba(232,238,244,.26)}
  .btn.on{color:#0e1a1c;background:var(--mint);border-color:var(--mint)}
  .btn .i{font-size:13px;line-height:1}
  .keys{position:absolute;left:20px;bottom:22px;color:rgba(143,162,179,.75);
    font-size:11.5px;letter-spacing:.6px}
  .keys b{color:rgba(232,238,244,.85);font-weight:500}
  #loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:#0a0f14;color:#9fb2c1;font-size:13px;letter-spacing:2px;
    transition:opacity .5s}
  #loading.hide{opacity:0;pointer-events:none}
  .vig{position:fixed;inset:0;z-index:5;pointer-events:none;
    background:radial-gradient(115% 88% at 50% 44%,transparent 40%,rgba(4,8,12,.72) 100%)}

  /* 手机适配 */
  @media (max-width: 700px) {
    .top{left:12px;right:12px;top:10px}
    .brand h1{font-size:12.5px;letter-spacing:1px}
    .status .chip:nth-child(1){display:none}
    .chip{padding:5px 9px;font-size:10.5px}
    .keys{display:none}
    .dock{bottom:14px;gap:6px}
    .btn{padding:8px 11px;font-size:11px;border-radius:9px}
    .btn .i{font-size:12px}
    #loading{font-size:12px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud">
  <div class="top">
    <div class="brand"><span class="dot"></span><h1>鲸鲸的小屋</h1></div>
    <div class="status">
      <span class="chip" id="chip-clock"><b>夜</b> 23:47</span>
      <span class="chip" id="chip-where"><b>站在</b> 地毯上</span>
      <span class="chip" id="chip-do"><b>正在</b> 发呆</span>
    </div>
  </div>

  <div class="keys"><b>WASD</b> 走动 · <b>Shift</b> 跑 · <b>Space</b> 蹦</div>

  <div class="dock">
    <div class="btn on" id="btn-auto"><span class="i">◇</span><span>自己乱走</span></div>
    <div class="btn on" id="btn-cat"><span class="i">🐾</span><span>白猫</span></div>
    <div class="btn" id="btn-lamp"><span class="i">☾</span><span>关灯</span></div>
  </div>
</div>

<div class="vig"></div>
<div id="loading">正在开门…</div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  app.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080d12);
  scene.fog = new THREE.Fog(0x080d12, 20, 38);

  var camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 120);
  camera.position.set(0, 5.4, 9.0);
  camera.lookAt(0, 0.9, 0);

  // ---------- 卡通材质 ----------
  function makeGradientMap() {
    var c = document.createElement('canvas');
    c.width = 4; c.height = 1;
    var ctx = c.getContext('2d');
    var stops = ['#4a4a4a', '#7a7a7a', '#a6a6a6', '#d2d2d2'];
    for (var i = 0; i < stops.length; i++) { ctx.fillStyle = stops[i]; ctx.fillRect(i, 0, 1, 1); }
    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.NearestFilter; t.magFilter = THREE.NearestFilter;
    t.generateMipmaps = false;
    return t;
  }
  var GRAD = makeGradientMap();
  function mat(color, opts) {
    return new THREE.MeshToonMaterial(Object.assign({ color: color, gradientMap: GRAD }, opts || {}));
  }
  var OUTLINE = new THREE.MeshBasicMaterial({ color: 0x0b1016, side: THREE.BackSide });

  function solid(w, h, d, color, x, y, z, outline) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    if (outline) {
      var o = new THREE.Mesh(m.geometry, OUTLINE);
      o.scale.set(1.05, 1.05, 1.05);
      m.add(o);
    }
    scene.add(m);
    return m;
  }

  // ---------- 光 ----------
  scene.add(new THREE.AmbientLight(0x9fb6cc, 0.16));
  var hemi = new THREE.HemisphereLight(0x8fb0cc, 0x1a222c, 0.22);
  scene.add(hemi);

  var moon = new THREE.DirectionalLight(0xa9c8e8, 0.42);
  moon.position.set(7, 8, -3);
  moon.castShadow = true;
  moon.shadow.mapSize.set(1024, 1024);
  moon.shadow.camera.left = -10; moon.shadow.camera.right = 10;
  moon.shadow.camera.top = 10; moon.shadow.camera.bottom = -10;
  moon.shadow.bias = -0.0012;
  scene.add(moon);

  var lampLight = new THREE.PointLight(0xffc98a, 1.35, 8.5, 2);
  lampLight.position.set(-2.55, 1.35, -1.15);
  scene.add(lampLight);

  var screenLight = new THREE.PointLight(0x7fc4ff, 0.5, 4.5, 2);
  screenLight.position.set(1.9, 1.0, -2.0);
  scene.add(screenLight);

  // ---------- 房间 ----------
  var W = 7.4, D = 6.4, H = 2.7;
  var hx = W / 2, hz = D / 2;

  var plankColors = [0xa8804f, 0xab8454, 0xa17a4b, 0xa67e50, 0xa47c4d];
  var plankW = 0.74;
  for (var pi = 0; pi < Math.round(W / plankW); pi++) {
    var px = -hx + plankW / 2 + pi * plankW;
    solid(plankW - 0.012, 0.12, D, plankColors[pi % plankColors.length], px, -0.06, 0, false);
  }

  solid(W, H, 0.16, 0x2f3742, 0, H / 2, -hz, true);
  solid(0.16, H, D, 0x2a323c, -hx, H / 2, 0, true);
  solid(0.16, H, D, 0x2a323c, hx, H / 2, 0, true);

  // 黑板
  function chalkTexture() {
    var c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#1d2b26'; ctx.fillRect(0, 0, 512, 256);
    ctx.strokeStyle = 'rgba(190,225,210,.55)'; ctx.fillStyle = 'rgba(190,225,210,.55)';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(120, 130, 46, 26, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(74, 130); ctx.lineTo(48, 108); ctx.lineTo(48, 152); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(146, 120, 3.5, 0, Math.PI * 2); ctx.fill();
    function star(x, y, r) {
      ctx.beginPath();
      for (var i = 0; i < 5; i++) {
        var a = -Math.PI / 2 + i * Math.PI * 2 / 5;
        var a2 = a + Math.PI / 5;
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
      }
      ctx.closePath(); ctx.stroke();
    }
    star(300, 80, 20); star(370, 150, 14); star(230, 200, 11);
    ctx.beginPath();
    ctx.moveTo(300, 210);
    ctx.quadraticCurveTo(330, 190, 360, 210);
    ctx.quadraticCurveTo(390, 230, 420, 210);
    ctx.stroke();
    ctx.font = '600 24px "Microsoft YaHei", sans-serif';
    ctx.fillText('今天也要开心', 54, 62);
    return new THREE.CanvasTexture(c);
  }
  var board = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.3),
    new THREE.MeshBasicMaterial({ map: chalkTexture() }));
  board.position.set(-1.35, 1.75, -hz + 0.1);
  scene.add(board);
  solid(2.72, 1.42, 0.05, 0x6b4f34, -1.35, 1.75, -hz + 0.07, true);

  // 夜空窗
  var nightSky = (function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 192;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 0, 192);
    g.addColorStop(0, '#12233a'); g.addColorStop(1, '#1d3a55');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 192);
    for (var i = 0; i < 60; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.6) + ')';
      ctx.fillRect(Math.random() * 256, Math.random() * 150, 1.6, 1.6);
    }
    ctx.fillStyle = 'rgba(240,235,210,.9)';
    ctx.beginPath(); ctx.arc(190, 52, 15, 0, Math.PI * 2); ctx.fill();
    return new THREE.CanvasTexture(c);
  })();
  solid(2.0, 1.35, 0.06, 0x3a3026, 1.55, 1.7, -hz + 0.1, true);
  var glass = new THREE.Mesh(new THREE.PlaneGeometry(1.78, 1.13),
    new THREE.MeshBasicMaterial({ map: nightSky }));
  glass.position.set(1.55, 1.7, -hz + 0.14);
  scene.add(glass);
  solid(1.82, 0.05, 0.04, 0x3a3026, 1.55, 1.7, -hz + 0.15, false);
  solid(0.05, 1.15, 0.04, 0x3a3026, 1.55, 1.7, -hz + 0.15, false);

  // 床
  solid(2.3, 0.16, 1.5, 0x4a3a2c, -2.15, 0.08, -2.0, true);
  solid(2.14, 0.26, 1.34, 0xdfe4ea, -2.15, 0.3, -2.0, true);
  solid(0.18, 0.7, 1.5, 0x3f3227, -3.24, 0.35, -2.0, true);
  solid(0.58, 0.16, 0.4, 0xf3f6f8, -2.9, 0.44, -2.0, true);
  solid(1.5, 0.12, 1.14, 0x3d5a8a, -1.95, 0.47, -2.0, true);
  solid(0.5, 0.1, 1.14, 0x4d6a9a, -1.5, 0.5, -2.0, true);

  // 地毯
  var rugEdge = new THREE.Mesh(new THREE.PlaneGeometry(3.36, 2.66), mat(0x2f3c4d));
  rugEdge.rotation.x = -Math.PI / 2;
  rugEdge.position.set(0.15, 0.006, 0.35);
  scene.add(rugEdge);
  var rug = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.5), mat(0x52657f));
  rug.rotation.x = -Math.PI / 2;
  rug.position.set(0.15, 0.012, 0.35);
  rug.receiveShadow = true;
  scene.add(rug);

  // 书架（开放格，能看到书）
  solid(0.06, 2.05, 1.92, 0x4a3320, 3.36, 1.02, -1.7, true);   // 背板
  solid(0.44, 2.05, 0.06, 0x5c412a, 3.15, 1.02, -2.66, true);  // 侧板
  solid(0.44, 2.05, 0.06, 0x5c412a, 3.15, 1.02, -0.74, true);  // 侧板
  solid(0.44, 0.06, 1.92, 0x5c412a, 3.15, 2.02, -1.7, false);  // 顶板
  var bookColors = [0xb5643f, 0x7a9a6b, 0x4f7396, 0xc2a15a, 0x8f6ba8, 0xa8544f, 0x5f8f8a];
  for (var sh = 0; sh < 4; sh++) {
    var sy = 0.24 + sh * 0.44;
    solid(0.44, 0.05, 1.92, 0x6b4a2f, 3.15, sy, -1.7, false);   // 隔板
    for (var bk = 0; bk < 8; bk++) {
      var bh = 0.18 + ((sh * 8 + bk) % 4) * 0.035;
      solid(0.26, bh, 0.11, bookColors[(sh + bk) % bookColors.length],
        3.14, sy + 0.03 + bh / 2, -2.42 + bk * 0.2, false);
    }
  }

  // 书桌
  solid(1.75, 0.08, 0.85, 0x6b4a2f, 1.85, 0.74, -1.25, true);
  [[-0.78, -0.34], [0.78, -0.34], [-0.78, 0.34], [0.78, 0.34]].forEach(function (o) {
    solid(0.08, 0.74, 0.08, 0x54381f, 1.85 + o[0], 0.37, -1.25 + o[1], false);
  });
  solid(0.9, 0.54, 0.05, 0x1b2530, 1.78, 1.16, -1.5, true);
  var screen = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.45),
    new THREE.MeshBasicMaterial({ color: 0x2b6fa8 }));
  screen.position.set(1.78, 1.16, -1.47);
  scene.add(screen);
  solid(0.07, 0.26, 0.07, 0x2b3742, 1.78, 0.89, -1.5, false);
  solid(0.5, 0.03, 0.16, 0x2f3a44, 1.6, 0.79, -1.12, false);
  var cup = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.14, 14), mat(0xd6c3a8));
  cup.position.set(2.35, 0.85, -1.05); cup.castShadow = true; scene.add(cup);

  // 椅子
  solid(0.56, 0.08, 0.54, 0x2a3038, 1.85, 0.46, -0.42, true);
  solid(0.50, 0.62, 0.08, 0x2a3038, 1.85, 0.80, -0.68, true);
  solid(0.07, 0.42, 0.07, 0x1e242b, 1.85, 0.22, -0.42, false);

  // 落地灯
  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.45, 8), mat(0x3a3f46));
  pole.position.set(-2.55, 0.72, -1.15); pole.castShadow = true; scene.add(pole);
  var shade = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.34, 14, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xffe0b0, side: THREE.DoubleSide }));
  shade.position.set(-2.55, 1.55, -1.15); scene.add(shade);

  // 圆凳 / 小圆桌
  var pouf = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.46, 0.34, 20), mat(0x46536b));
  pouf.position.set(1.75, 0.17, 1.75); pouf.castShadow = true; pouf.receiveShadow = true;
  scene.add(pouf);
  var table = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.06, 22), mat(0x6b4a2f));
  table.position.set(-0.15, 0.36, 2.15); table.castShadow = true; scene.add(table);
  var tleg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.34, 10), mat(0x54381f));
  tleg.position.set(-0.15, 0.17, 2.15); scene.add(tleg);


  // ---------- 角色 ----------
  setTimeout(function () {
    var ld = document.getElementById('loading');
    if (ld) ld.classList.add('hide');
  }, 4000);

  var CLIPS = { idle: 'idle.webm', run: 'run.webm', jump: 'jump.webm',
    think: 'think.webm', eat: 'eat.webm', sleep: 'sleep.webm' };
  var videos = {}, textures = {}, ready = 0, total = Object.keys(CLIPS).length;

  Object.keys(CLIPS).forEach(function (name) {
    var v = document.createElement('video');
    v.src = CLIPS[name];
    v.loop = (name === 'idle' || name === 'run' || name === 'sleep');
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.addEventListener('loadeddata', function () {
      ready++;
      if (ready >= total) document.getElementById('loading').classList.add('hide');
    });
    v.load();
    videos[name] = v;
    var t = new THREE.VideoTexture(v);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
    textures[name] = t;
  });

  var CW = 1.85, CH = CW * (9 / 16);
  var charMat = new THREE.ShaderMaterial({
    uniforms: { map: { value: textures.idle } },
    vertexShader: [
      'varying vec2 vUv;',
      'void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D map;',
      'varying vec2 vUv;',
      'void main(){',
      '  vec4 c = texture2D(map, vUv);',
      '  float l = max(c.r, max(c.g, c.b));',
      '  if (c.a < 0.08) discard;',
      '  if (l < 0.085) discard;',
      '  gl_FragColor = vec4(c.rgb, 1.0);',
      '}'
    ].join('\n'),
    transparent: true, depthWrite: false, side: THREE.DoubleSide
  });
  var character = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), charMat);
  character.position.set(0.1, CH / 2, 0.7);
  scene.add(character);

  var shadow = new THREE.Mesh(new THREE.CircleGeometry(0.36, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.1, 0.02, 0.7);
  scene.add(shadow);

  var glow = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32),
    new THREE.MeshBasicMaterial({ color: 0xffb877, transparent: true, opacity: 0.12 }));
  glow.rotation.x = -Math.PI / 2;
  glow.position.set(-2.55, 0.02, -1.15);
  scene.add(glow);

  // ---------- 白猫（矢量手绘 Q 版，和角色同一套风格） ----------
  function drawCat(opts) {
    opts = opts || {};
    var S = 320;
    var c = document.createElement('canvas');
    c.width = S; c.height = S;
    var g = c.getContext('2d');
    g.translate(S / 2, S / 2);

    var tail = opts.tail || 0;
    var step = opts.step || 0;
    var blink = opts.blink || 0;

    var ink = '#2b3340';
    var fur = '#f8f6f1';
    var furShade = '#e4dfd6';

    g.lineJoin = 'round';
    g.lineCap = 'round';

    // 尾巴（压在身体后面）
    g.save();
    g.beginPath();
    g.moveTo(-44, 56);
    g.bezierCurveTo(-98, 36 + tail, -108, -26 + tail, -68, -46 + tail);
    g.strokeStyle = ink; g.lineWidth = 32; g.stroke();
    g.strokeStyle = fur; g.lineWidth = 23; g.stroke();
    g.restore();

    // 身体
    g.save();
    g.beginPath();
    g.ellipse(0, 58 + step, 62, 54, 0, 0, Math.PI * 2);
    var bg = g.createLinearGradient(0, 8, 0, 112);
    bg.addColorStop(0, fur);
    bg.addColorStop(1, furShade);
    g.fillStyle = bg; g.fill();
    g.strokeStyle = ink; g.lineWidth = 9; g.stroke();
    g.restore();

    // 前爪
    [-27, 27].forEach(function (px) {
      g.save();
      g.beginPath();
      g.ellipse(px, 106 + step, 19, 14, 0, 0, Math.PI * 2);
      g.fillStyle = fur; g.fill();
      g.strokeStyle = ink; g.lineWidth = 8; g.stroke();
      g.restore();
    });

    // 头
    g.save();
    g.beginPath();
    g.ellipse(0, -34, 78, 70, 0, 0, Math.PI * 2);
    var hg = g.createRadialGradient(-24, -64, 10, 0, -26, 100);
    hg.addColorStop(0, '#ffffff');
    hg.addColorStop(1, '#eae5dc');
    g.fillStyle = hg; g.fill();
    g.strokeStyle = ink; g.lineWidth = 9; g.stroke();
    g.restore();

    // 耳朵
    [[-56, -88, -1], [56, -88, 1]].forEach(function (e) {
      g.save();
      g.beginPath();
      g.moveTo(e[0] - 27, e[1] + 36);
      g.quadraticCurveTo(e[0] + e[2] * 4, e[1] - 30, e[0] + 27, e[1] + 36);
      g.closePath();
      g.fillStyle = fur; g.fill();
      g.strokeStyle = ink; g.lineWidth = 9; g.stroke();
      g.beginPath();
      g.moveTo(e[0] - 13, e[1] + 30);
      g.quadraticCurveTo(e[0] + e[2] * 2, e[1] - 6, e[0] + 13, e[1] + 30);
      g.closePath();
      g.fillStyle = '#f3bcc4'; g.fill();
      g.restore();
    });

    // 眼睛
    [[-31, -34], [31, -34]].forEach(function (pt) {
      g.save();
      if (blink) {
        g.beginPath();
        g.moveTo(pt[0] - 15, pt[1] + 2);
        g.quadraticCurveTo(pt[0], pt[1] + 12, pt[0] + 15, pt[1] + 2);
        g.strokeStyle = ink; g.lineWidth = 8; g.stroke();
      } else {
        g.beginPath();
        g.ellipse(pt[0], pt[1], 15, 19, 0, 0, Math.PI * 2);
        g.fillStyle = '#2b3340'; g.fill();
        g.beginPath();
        g.ellipse(pt[0] - 5, pt[1] - 7, 5.5, 6.5, 0, 0, Math.PI * 2);
        g.fillStyle = '#ffffff'; g.fill();
        g.beginPath();
        g.ellipse(pt[0] + 6, pt[1] + 9, 2.6, 3, 0, 0, Math.PI * 2);
        g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
      }
      g.restore();
    });

    // 腮红
    [[-54, -8], [54, -8]].forEach(function (pt) {
      g.save();
      var rg = g.createRadialGradient(pt[0], pt[1], 1, pt[0], pt[1], 19);
      rg.addColorStop(0, 'rgba(244,166,178,.55)');
      rg.addColorStop(1, 'rgba(244,166,178,0)');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(pt[0], pt[1], 19, 13, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    });

    // 鼻子 + 嘴
    g.save();
    g.beginPath();
    g.moveTo(-8, -6); g.lineTo(8, -6); g.lineTo(0, 4); g.closePath();
    g.fillStyle = '#e8909f'; g.fill();
    g.beginPath();
    g.moveTo(0, 4); g.quadraticCurveTo(-9, 15, -18, 9);
    g.moveTo(0, 4); g.quadraticCurveTo(9, 15, 18, 9);
    g.strokeStyle = ink; g.lineWidth = 4.5; g.stroke();
    g.restore();

    // 胡须
    g.save();
    g.strokeStyle = 'rgba(43,51,64,.6)'; g.lineWidth = 3.5;
    [-1, 1].forEach(function (s) {
      g.beginPath();
      g.moveTo(s * 46, -10);
      g.lineTo(s * 86, -18);
      g.moveTo(s * 46, -1);
      g.lineTo(s * 88, 2);
      g.stroke();
    });
    g.restore();

    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    return t;
  }

  var catIdleA = drawCat({ tail: 0 });
  var catIdleB = drawCat({ tail: 16, blink: 1 });
  var catWalk = drawCat({ tail: -12, step: -5 });

  var CAT_SIZE = 0.62;
  var catMat = new THREE.MeshBasicMaterial({
    map: catIdleA, transparent: true, alphaTest: 0.04,
    depthWrite: false, side: THREE.DoubleSide
  });
  var CAT_HOME = { x: 0.95, z: 1.15 };
  var cat = new THREE.Mesh(new THREE.PlaneGeometry(CAT_SIZE, CAT_SIZE), catMat);
  cat.position.set(CAT_HOME.x, CAT_SIZE / 2, CAT_HOME.z);
  scene.add(cat);

  var catShadow = new THREE.Mesh(new THREE.CircleGeometry(0.17, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 }));
  catShadow.rotation.x = -Math.PI / 2;
  catShadow.position.set(CAT_HOME.x, 0.015, CAT_HOME.z);
  scene.add(catShadow);

  // ---------- 猫可以拖动 ----------
  var CAT_SURFACES = [
    { name: '床',   x: -2.15, z: -2.00, w: 2.42, d: 1.60, top: 0.53 },
    { name: '书桌', x:  1.85, z: -1.25, w: 1.85, d: 0.95, top: 0.78 },
    { name: '圆凳', x:  1.75, z:  1.75, w: 0.92, d: 0.92, top: 0.34 },
    { name: '小桌', x: -0.15, z:  2.15, w: 1.00, d: 1.00, top: 0.39 }
  ];

  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  var hitPoint = new THREE.Vector3();

  function setPointer(ev) {
    var r = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  }

  function pickCat(ev) {
    setPointer(ev);
    raycaster.setFromCamera(pointer, camera);
    var hitsList = raycaster.intersectObject(cat, false);
    return hitsList.length > 0;
  }

  function dragTo(ev) {
    setPointer(ev);
    raycaster.setFromCamera(pointer, camera);
    if (!raycaster.ray.intersectPlane(groundPlane, hitPoint)) return;
    catState.pos.x = Math.max(-BX, Math.min(BX, hitPoint.x));
    catState.pos.z = Math.max(-BZ, Math.min(BZ, hitPoint.z));
    catState.surfaceY = 0;
  }

  function surfaceAt(x, z) {
    for (var i = 0; i < CAT_SURFACES.length; i++) {
      var s = CAT_SURFACES[i];
      if (Math.abs(x - s.x) < s.w / 2 && Math.abs(z - s.z) < s.d / 2) return s;
    }
    return null;
  }

  renderer.domElement.addEventListener('pointerdown', function (ev) {
    // 点到猫：开始拖动
    if (cat.visible && pickCat(ev)) {
      catState.dragging = true;
      catState.target = null;
      catState.anchored = false;
      renderer.domElement.style.cursor = 'grabbing';
      ev.preventDefault();
      return;
    }
    // 点到地面：让她走过去（手机没有键盘也能操作）
    setPointer(ev);
    raycaster.setFromCamera(pointer, camera);
    if (raycaster.ray.intersectPlane(groundPlane, hitPoint)) {
      var tx = Math.max(-BX, Math.min(BX, hitPoint.x));
      var tz = Math.max(-BZ, Math.min(BZ, hitPoint.z));
      if (!hits(tx, tz)) {
        state.target = { x: tx, z: tz };
        state.waitUntil = 0;
        state.manualUntil = performance.now() + 3000;
        state.sleeping = false;
        state.inBed = false;
      }
    }
    startAll();
  });

  renderer.domElement.addEventListener('pointermove', function (ev) {
    if (catState.dragging) {
      dragTo(ev);
      ev.preventDefault();
    } else if (cat.visible) {
      renderer.domElement.style.cursor = pickCat(ev) ? 'grab' : 'default';
    }
  });

  addEventListener('pointerup', function () {
    if (!catState.dragging) return;
    catState.dragging = false;
    renderer.domElement.style.cursor = 'default';
    var s = surfaceAt(catState.pos.x, catState.pos.z);
    if (s) {
      catState.pos.x = s.x;
      catState.pos.z = s.z;
      catState.surfaceY = s.top;
      catState.anchored = true;
      catState.target = null;
    } else {
      catState.surfaceY = 0;
      catState.anchored = false;
      catState.waitUntil = performance.now() + 3000;
    }
  });

  // 双击猫：放回地面
  renderer.domElement.addEventListener('dblclick', function (ev) {
    if (!cat.visible || !pickCat(ev)) return;
    catState.anchored = false;
    catState.surfaceY = 0;
    catState.pos.set(CAT_HOME.x, 0, CAT_HOME.z);
    catState.waitUntil = performance.now() + 2500;
  });

  // ---------- 碰撞 ----------
  var BX = hx - 0.72, BZ = hz - 0.72;
  var RADIUS = 0.32;
  var OBSTACLES = [
    { x: -2.15, z: -2.00, w: 2.42, d: 1.60 },
    { x:  1.85, z: -1.25, w: 1.85, d: 0.95 },
    { x:  1.85, z: -0.42, w: 0.64, d: 0.62 },
    { x:  3.15, z: -1.70, w: 0.50, d: 2.00 },
    { x: -2.55, z: -1.15, w: 0.38, d: 0.38 },
    { x:  1.75, z:  1.75, w: 0.92, d: 0.92 },
    { x: -0.15, z:  2.15, w: 1.00, d: 1.00 }
  ];

  function hits(x, z, r) {
    var rad = r || RADIUS;
    if (Math.abs(x) > BX || Math.abs(z) > BZ) return true;
    for (var i = 0; i < OBSTACLES.length; i++) {
      var o = OBSTACLES[i];
      if (Math.abs(x - o.x) < o.w / 2 + rad && Math.abs(z - o.z) < o.d / 2 + rad) return true;
    }
    return false;
  }

  var state = {
    pos: new THREE.Vector3(0.1, 0, 0.7),
    facing: 1, busy: null, clip: 'idle',
    auto: true, target: null, waitUntil: 0,
    manualUntil: 0, moving: false,
    sleeping: false, inBed: false
  };

  // 床（睡觉的位置）
  var BED = { x: -2.05, z: -1.72, top: 0.53, front: { x: -2.05, z: -0.95 } };
  var FORCE_NIGHT = /(?:^|[?&])night=1/.test(location.search);
  function isBedtime() {
    if (FORCE_NIGHT) return true;
    var d = new Date();
    var mins = d.getHours() * 60 + d.getMinutes();
    return mins >= 23 * 60 + 30 || mins < 6 * 60 + 30;
  }
  var keys = {}, SPEED = 2.1, RUN = 1.7, AUTO_SPEED = 0.95;

  function playClip(n) {
    if (state.clip === n) return;
    state.clip = n;
    var v = videos[n]; if (!v) return;
    v.currentTime = 0; v.play().catch(function () {});
    charMat.uniforms.map.value = textures[n];
  }
  function playOnce(n) {
    state.busy = n;
    var v = videos[n]; v.loop = false; v.currentTime = 0;
    v.play().catch(function () {});
    charMat.uniforms.map.value = textures[n];
    v.onended = function () { state.busy = null; v.onended = null; playClip('idle'); };
  }
  function startAll() {
    Object.keys(videos).forEach(function (n) { var v = videos[n]; if (v.paused) v.play().catch(function () {}); });
  }

  function pickTarget() {
    for (var i = 0; i < 60; i++) {
      var x = (Math.random() * 2 - 1) * (BX - 0.1);
      var z = (Math.random() * 2 - 1) * (BZ - 0.1);
      if (!hits(x, z)) return { x: x, z: z };
    }
    return { x: 0.1, z: 0.7 };
  }

  addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    keys[k] = true;
    state.manualUntil = performance.now() + 5000;
    if (e.code === 'Space' && !state.busy) { e.preventDefault(); playOnce('jump'); }
    if (k === 'e' && !state.busy) playOnce('think');
    if (k === 'q' && !state.busy) playOnce('eat');
    startAll();
  });
  addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  ['click', 'touchstart'].forEach(function (ev) { addEventListener(ev, startAll, { once: true }); });

  // ---------- 按钮 ----------
  var btnAuto = document.getElementById('btn-auto');
  var btnCat = document.getElementById('btn-cat');
  var btnLamp = document.getElementById('btn-lamp');
  var lampOn = true;

  btnAuto.addEventListener('click', function () {
    state.auto = !state.auto;
    btnAuto.classList.toggle('on', state.auto);
    if (state.auto) state.waitUntil = 0;
  });
  btnCat.addEventListener('click', function () {
    cat.visible = !cat.visible;
    catShadow.visible = cat.visible;
    btnCat.classList.toggle('on', cat.visible);
  });
  btnLamp.addEventListener('click', function () {
    lampOn = !lampOn;
    lampLight.intensity = lampOn ? 1.35 : 0.05;
    shade.material.color.setHex(lampOn ? 0xffe0b0 : 0x5a5040);
    glow.material.opacity = lampOn ? 0.12 : 0.02;
    btnLamp.classList.toggle('on', !lampOn);
    btnLamp.querySelector('span:last-child').textContent = lampOn ? '关灯' : '开灯';
  });

  // ---------- 猫 AI ----------
  var catState = { pos: new THREE.Vector3(0.95, 0, 1.15), target: null, waitUntil: 0,
    heading: 0, dirX: 0, dragging: false, anchored: false, surfaceY: 0 };

  function catPick() {
    for (var i = 0; i < 50; i++) {
      var x = (Math.random() * 2 - 1) * (BX - 0.2);
      var z = (Math.random() * 2 - 1) * (BZ - 0.2);
      if (!hits(x, z, 0.22)) return { x: x, z: z };
    }
    return { x: 1.8, z: 1.6 };
  }

  // ---------- 循环 ----------
  var clock = new THREE.Clock();
  var look = new THREE.Vector3();
  var want = new THREE.Vector3();
  var whereChip = document.getElementById('chip-where');
  var clockChip = document.getElementById('chip-clock');
  setInterval(function () {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    var part = (d.getHours() >= 6 && d.getHours() < 18) ? '日' : '夜';
    clockChip.innerHTML = '<b>' + part + '</b> ' + hh + ':' + mm;
  }, 1000);
  var doChip = document.getElementById('chip-do');

  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = performance.now();

    var mx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    var mz = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
    var manual = (mx || mz) && !state.busy;

    if (manual) {
      var len = Math.hypot(mx, mz) || 1;
      var sp = SPEED * (keys['shift'] ? RUN : 1);
      var dx = (mx / len) * sp * dt;
      var dz = (mz / len) * sp * dt;
      if (!hits(state.pos.x + dx, state.pos.z)) state.pos.x += dx;
      if (!hits(state.pos.x, state.pos.z + dz)) state.pos.z += dz;
      if (mx) state.facing = mx > 0 ? 1 : -1;
      state.moving = true;
      state.target = null;
      state.sleeping = false;
      state.inBed = false;
    } else if (isBedtime() && !state.busy && t > state.manualUntil) {
      if (!state.sleeping) {
        // 先走到床边
        var fx = BED.front.x - state.pos.x;
        var fz = BED.front.z - state.pos.z;
        var fd = Math.hypot(fx, fz);
        if (fd > 0.16) {
          var fstep = AUTO_SPEED * dt;
          var fnx = state.pos.x + (fx / fd) * fstep;
          var fnz = state.pos.z + (fz / fd) * fstep;
          if (!hits(fnx, state.pos.z)) state.pos.x = fnx;
          if (!hits(state.pos.x, fnz)) state.pos.z = fnz;
          state.moving = true;
          if (Math.abs(fx) > 0.05) state.facing = fx > 0 ? 1 : -1;
        } else {
          state.sleeping = true;
          state.moving = false;
          state.target = null;
        }
      } else {
        // 爬上床，慢慢挪到床中间
        state.moving = false;
        state.target = null;
        state.pos.x += (BED.x - state.pos.x) * Math.min(1, dt * 2.2);
        state.pos.z += (BED.z - state.pos.z) * Math.min(1, dt * 2.2);
        if (Math.hypot(BED.x - state.pos.x, BED.z - state.pos.z) < 0.06) state.inBed = true;
      }
    } else if (state.auto && t > state.manualUntil && !state.busy) {
      if (!state.target) {
        if (t > state.waitUntil) state.target = pickTarget();
      }
      if (state.target) {
        var ddx = state.target.x - state.pos.x;
        var ddz = state.target.z - state.pos.z;
        var dist = Math.hypot(ddx, ddz);
        if (dist < 0.12) {
          state.target = null;
          state.waitUntil = t + 1800 + Math.random() * 4200;
          state.moving = false;
        } else {
          var step = AUTO_SPEED * dt;
          var nx = state.pos.x + (ddx / dist) * step;
          var nz = state.pos.z + (ddz / dist) * step;
          if (!hits(nx, state.pos.z)) state.pos.x = nx; else state.target = null;
          if (!hits(state.pos.x, nz)) state.pos.z = nz; else state.target = null;
          state.moving = true;
          if (Math.abs(ddx) > 0.05) state.facing = ddx > 0 ? 1 : -1;
        }
      } else {
        state.moving = false;
      }
    } else {
      state.moving = false;
    }

    if (!state.busy) playClip(state.sleeping ? 'sleep' : (state.moving ? 'run' : 'idle'));

    var bob = state.moving ? Math.sin(t / 110) * 0.03 : Math.sin(t / 700) * 0.01;
    if (state.sleeping) bob = Math.sin(t / 1200) * 0.008;
    var baseY = state.inBed ? BED.top : 0.01;
    character.scale.x = state.facing;
    character.position.set(state.pos.x, baseY + CH / 2 + bob, state.pos.z);
    shadow.visible = !state.inBed;
    shadow.position.set(state.pos.x, baseY + 0.01, state.pos.z);

    // 猫
    if (cat.visible) {
      if (!catState.target && !catState.anchored && !catState.dragging && t > catState.waitUntil) {
        catState.target = catPick();
      }
      if (catState.target) {
        var cx = catState.target.x - catState.pos.x;
        var cz = catState.target.z - catState.pos.z;
        var cd = Math.hypot(cx, cz);
        if (cd < 0.1) {
          catState.target = null;
          catState.waitUntil = t + 1500 + Math.random() * 5000;
        } else {
          var cstep = 0.75 * dt;
          var nx2 = catState.pos.x + (cx / cd) * cstep;
          var nz2 = catState.pos.z + (cz / cd) * cstep;
          if (!hits(nx2, catState.pos.z, 0.2)) catState.pos.x = nx2; else catState.target = null;
          if (!hits(catState.pos.x, nz2, 0.2)) catState.pos.z = nz2; else catState.target = null;
          catState.heading = Math.atan2(cx, cz);
          if (Math.abs(cx) > 0.02) catState.dirX = cx;
        }
      }
      var catMoving = !!catState.target && !catState.dragging && !catState.anchored;
      cat.position.set(
        catState.pos.x,
        catState.surfaceY + CAT_SIZE / 2 + (catMoving ? Math.abs(Math.sin(t / 160)) * 0.03 : 0),
        catState.pos.z
      );
      if (catState.dirX) cat.scale.x = catState.dirX > 0 ? 1 : -1;
      // 帧率调低：走路 280ms 换一帧，6 秒才眨一次
      if (catMoving) {
        catMat.map = (Math.floor(t / 280) % 2 === 0) ? catWalk : catIdleA;
      } else {
        catMat.map = ((t % 6000) < 170) ? catIdleB : catIdleA;
      }
      catShadow.visible = !catState.anchored;
      catShadow.position.set(catState.pos.x, 0.015, catState.pos.z);
    }

    // 相机
    look.set(state.pos.x * 0.22, 0.95, 0.3);
    var aspectR = innerWidth / innerHeight;
    var camZ = aspectR < 1 ? 9.0 + (1 - aspectR) * 7.5 : 9.0;
    want.set(state.pos.x * 0.26, 5.4 * (camZ / 9.0), camZ);
    camera.position.lerp(want, 1 - Math.pow(0.0025, dt));
    camera.lookAt(look);

    // 状态
    var place = state.inBed ? '床上' : '房间里';
    if (Math.abs(state.pos.x + 2.15) < 1.3 && Math.abs(state.pos.z + 2.0) < 0.9) place = '床边';
    else if (Math.abs(state.pos.x - 1.85) < 1.0 && Math.abs(state.pos.z + 1.25) < 0.6) place = '书桌前';
    else if (Math.abs(state.pos.x - 3.15) < 0.6) place = '书架旁';
    else if (Math.abs(state.pos.x - 0.15) < 1.7 && Math.abs(state.pos.z - 0.35) < 1.3) place = '地毯上';
    else if (Math.abs(state.pos.x + 2.55) < 0.6) place = '灯旁边';

    whereChip.innerHTML = '<b>站在</b> ' + place;
    doChip.innerHTML = '<b>正在</b> ' + (state.inBed ? '睡觉' : (state.busy
      ? ({ jump: '蹦跶', think: '发呆', eat: '吃东西' })[state.busy] || '忙'
      : (state.moving ? '走来走去' : '发呆')));

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  addEventListener('resize', function () {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  tick();

  // PWA：注册离线缓存（只在 http/https 下生效）
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
